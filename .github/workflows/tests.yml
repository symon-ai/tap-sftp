name: Tests

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - 'master'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.13']
    steps:
    - uses: actions/checkout@v2

    - name: Start SSH agent for private Poetry dependencies
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: |
            ${{ secrets.FILE_PROCESSORS_DEPLOY_KEY }}
            ${{ secrets.PYTHON_GNUPG_DEPLOY_KEY }}

    - name: Set up Python ${{matrix.python-version}}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry and project dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        # Poetry 2.x uses dulwich by default; it ignores ssh-agent deploy-key routing.
        poetry config system-git-client true
        poetry install --no-interaction

    - name: Add dependencies
      run: |
        poetry add flake8@^5.0.4 tox-gh-actions@^2.11.0

    - name: Build coverage file
      run: |
        poetry run pytest --cov-report=term-missing --junitxml=/tmp/pytest.xml --cov=. tests/ | tee /tmp/pytest-coverage.txt
    - name: Pytest coverage comment
      uses: MishaKav/pytest-coverage-comment@main
      with:
        pytest-coverage-path: /tmp/pytest-coverage.txt
        junitxml-path: /tmp/pytest.xml
    - name: Test with tox
      run: poetry run tox